sources:

  # ── Hacker News ───────────────────────────────────────────────────────────
  - name: Hacker News
    type: rss
    url: https://news.ycombinator.com/rss
    category: tech
    language: en
    country: global
    priority: 1
    refresh_minutes: 15
    extraction_strategy: rss_then_article
    enabled: true

  # ── Google News — AI / LLM ────────────────────────────────────────────────
  - name: Google News — Intelligence Artificielle FR
    type: google_news_rss
    query: "intelligence artificielle"
    language: fr
    country: FR
    category: ai
    priority: 1
    refresh_minutes: 30
    extraction_strategy: article
    enabled: true

  - name: Google News — Local LLM EN
    type: google_news_rss
    query: "local llm open source"
    language: en
    country: global
    category: ai
    priority: 1
    refresh_minutes: 30
