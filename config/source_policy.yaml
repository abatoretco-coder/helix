# Admission policy for the active Helix workflow.
# Catalogue sources remain in sources.yaml; this file determines which ones are
# allowed to consume network, extraction and Ollama capacity.
enabled: true
max_candidate_age_days: 7

# Google News is useful for manual discovery, but its RSS links are relays
# that resolve to consent pages in the current collector.  It must never feed
# the production extraction or briefing pipeline.
block_source_types:
  - google_news_rss

# Sources suspended after the factual/commercial viability audit.  Their feeds
# are mixed with retail and deal content at a rate incompatible with Helix.
block_sources:
  - Futura Sciences
  - Clubic

# Broad world-news, recommendation and leisure feeds created most of the load
# while contributing little to the stated AI/logistics/regulation watchlist.
block_categories:
  - countries
  - recommended
  - general
  - travel

allow_categories:
  - ai
  - tech
  - science
  - supply_chain
  - pharma
  - climate
  - cybersecurity
  - startups
  - regulation
  - geopolitics
  - finance

# Broad but useful domains are admitted only when title or snippet matches one
# of the monitored subjects. Dedicated category feeds are admitted directly.
keyword_required_categories:
  - tech
  - science
  - geopolitics
  - regulation
  - finance

