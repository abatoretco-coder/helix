# Commercial-content guardrail.  This is deliberately deterministic and runs
# before extraction and before any local-model request.  It targets material
# that is *itself* promotional (sponsored posts, affiliate deals, buying
# guides), not reporting about advertising, products or regulation.
advertising_filter:
  enabled: true
  block_source_terms:
    - sponsored
    - advertorial
    - affiliate
    - shopping deals
    - coupon
    - bons plans
    - code promo
  block_url_patterns:
    - "/sponsored/"
    - "/advertorial/"
    - "/partner-content/"
    - "/brand-studio/"
    - "/affiliate/"
  disclosure_terms:
    - "sponsored content"
    - "paid content"
    - "paid post"
    - "brand partner"
    - "presented by"
    - "in partnership with"
    - "advertorial"
    - "affiliate links"
    - "this post contains affiliate"
    - "contenu sponsorise"
    - "article sponsorise"
    - "publireportage"
    - "contenu de marque"
    - "en partenariat avec"
    - "lien affilie"
    - "liens affilies"
  promotional_terms:
    - "buy now"
    - "shop now"
    - "limited time offer"
    - "promo code"
    - "coupon code"
    - "free shipping"
    - "black friday"
    - "cyber monday"
    - "% off"
    - "acheter maintenant"
    - "offre limitee"
    - "offre a duree limitee"
    - "fait un carton sur amazon"
    - "en promo sur amazon"
    - "code promo"
    - "bon plan"
    - "meilleur prix"
    - "livraison gratuite"
  promotional_patterns:
    - '\b(top|best) \d+ .*\b(to buy|for sale)\b'
    - '\b\d+ (best|top) .*\b(to buy|for sale)\b'
    - '\b(meilleurs?|top) \d+ .*\b(a acheter|en promotion)\b'
    # Helix is an intelligence feed, not a product-review feed.  These
    # editorial buying guides can lack an affiliate disclosure but still have
    # no enduring informational value for Jarvis.
    - '\b(?:best|top|meilleurs?)\b.{0,80}\b(?:camera|cameras|smartphone|laptop|notebook|notebooks|pen|pens|headphones?|tv|television|electric bike|velo electrique|sonnette|robot|gadget)s?\b'
    - '\b(?:review|test|hands-on)\b.{0,80}\b(?:camera|smartphone|laptop|notebook|headphones?|tv|television|electric bike|velo electrique|sonnette|robot|gadget)s?\b'
    # A price drop attached to a retail marketplace is commercial content,
    # even if the source publishes science or technology reporting elsewhere.
    - '\b(?:amazon|cdiscount|fnac|darty|boulanger)\b.{0,90}\b(?:-\s?\d{1,3}\s?%|remise de \d+\s?%|baisse de \d+\s?€)'
    - '\b(?:-\s?\d{1,3}\s?%|remise de \d+\s?%|baisse de \d+\s?€).{0,90}\b(?:amazon|cdiscount|fnac|darty|boulanger)\b'
