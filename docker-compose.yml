services:

  # ── Data layer ────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: news_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: newsdb
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d newsdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: news_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: news_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Search ────────────────────────────────────────────────────────────────

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: news_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - ./data/meili:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ── morss — RSS enricher (transforms thin RSS into full-text RSS) ─────────
  # https://github.com/pictuga/morss
  morss:
    image: pictuga/morss:latest
    container_name: news_morss
    restart: unless-stopped
    ports:
      - "8081:8080"
    # morss enriches RSS feeds on-the-fly via HTTP proxying:
    #   http://morss:8080/http://feeds.example.com/rss
    # Workers call morss for sources with extraction_strategy: morss

  # ── RSS cockpit ───────────────────────────────────────────────────────────
  # https://github.com/FreshRSS/FreshRSS

  freshrss:
    image: freshrss/freshrss:latest
    container_name: news_freshrss
    restart: unless-stopped
    volumes:
      - ./data/freshrss:/var/www/FreshRSS/data
      - ./data/freshrss-ext:/var/www/FreshRSS/extensions
    environment:
      CRON_MIN: "*/15"
      TZ: Europe/Paris
    ports:
      - "${FRESHRSS_PORT:-8080}:80"

  # ── Local LLM ─────────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    container_name: news_ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment if you have a GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Backend API ───────────────────────────────────────────────────────────

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: news_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://news:${POSTGRES_PASSWORD}@postgres:5432/newsdb
      REDIS_URL: redis://redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      OLLAMA_URL: http://ollama:11434
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      APP_ENV: production
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ── Collect worker ────────────────────────────────────────────────────────

  worker_collect:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: news_worker_collect
    restart: unless-stopped
    command: python -m app.workers.collect
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://news:${POSTGRES_PASSWORD}@postgres:5432/newsdb
      REDIS_URL: redis://redis:6379/0
      SOURCES_PATH: /app/config/sources.yaml
      APP_ENV: production
    volumes:
      - ./config:/app/config:ro

  # ── Extract worker ────────────────────────────────────────────────────────

  worker_extract:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: news_worker_extract
    restart: unless-stopped
    command: python -m app.workers.extract
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://news:${POSTGRES_PASSWORD}@postgres:5432/newsdb
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MORSS_URL: http://morss:8080
      APP_ENV: production

  # ── AI worker ─────────────────────────────────────────────────────────────

  worker_ai:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: news_worker_ai
    restart: unless-stopped
    command: python -m app.workers.ai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://news:${POSTGRES_PASSWORD}@postgres:5432/newsdb
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      SOURCES_PATH: /app/config/sources.yaml
      SCORING_PATH: /app/config/scoring_rules.yaml
      PROMPTS_PATH: /app/config/llm_prompts.yaml
      APP_ENV: production
    volumes:
      - ./config:/app/config:ro

  # ── Dashboard ─────────────────────────────────────────────────────────────

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${NAS_IP:-localhost}:8000
        NEXT_PUBLIC_MEILI_URL: http://${NAS_IP:-localhost}:7700
        NEXT_PUBLIC_MEILI_SEARCH_KEY: ${MEILI_SEARCH_KEY:-}
    container_name: news_dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
