services:

  # ── Data layer ────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: news_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: newsdb
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d newsdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: news_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: news_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Search ────────────────────────────────────────────────────────────────

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: news_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - ./data/meili:/meili_data
    ports:
      - "127.0.0.1:7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ── morss — RSS enricher (transforms thin RSS into full-text RSS) ─────────
  # https://github.com/pictuga/morss
  morss:
    image: pictuga/morss:latest
    container_name: news_morss
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    # morss enriches RSS feeds on-the-fly via HTTP proxying:
    #   http://morss:8080/http://feeds.example.com/rss
    # Workers call morss for sources with extraction_strategy: morss

  # ── RSS cockpit ───────────────────────────────────────────────────────────
  # https://github.com/FreshRSS/FreshRSS

  freshrss:
    image: freshrss/freshrss:latest
    container_name: news_freshrss
    restart: unless-stopped
    volumes:
      - ./data/freshrss:/var/www/FreshRSS/data
      - ./data/freshrss-ext:/var/www/FreshRSS/extensions
    environment:
      CRON_MIN: "*/15"
      TZ: Europe/Paris
    ports:
      - "${FRESHRSS_PORT:-8082}:80"

  # ── Backend API ───────────────────────────────────────────────────────────

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: news_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://news:${POSTGRES_PASSWORD}@postgres:5432/newsdb
      REDIS_URL: redis://redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      HELIX_API_TOKEN: ${HELIX_API_TOKEN:-}
      REQUIRE_API_TOKEN: ${REQUIRE_API_TOKEN:-false}
      HOME_ASSISTANT_WEBHOOK_URL: ${HOME_ASSISTANT_WEBHOOK_URL:-}
      HOME_ASSISTANT_WEBHOOK_TOKEN: ${HOME_ASSISTANT_WEBHOOK_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama-central:11434}
      NEWS_SUMMARY_PROVIDER: ${NEWS_SUMMARY_PROVIDER:-local}
      BACKGROUND_AI_ENABLED: ${BACKGROUND_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      NEWS_SUMMARY_MODEL: ${NEWS_SUMMARY_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      JARVIS_OUTPUT_TOKENS: ${JARVIS_OUTPUT_TOKENS:-420}
      NEWS_SUMMARY_TIMEOUT_SECONDS: ${NEWS_SUMMARY_TIMEOUT_SECONDS:-30}
      OPENAI_DAILY_REQUEST_LIMIT: ${OPENAI_DAILY_REQUEST_LIMIT:-0}
      OPENAI_MONTHLY_REQUEST_LIMIT: ${OPENAI_MONTHLY_REQUEST_LIMIT:-0}
      OPENAI_NEWS_SUMMARY_DAILY_REQUEST_LIMIT: ${OPENAI_NEWS_SUMMARY_DAILY_REQUEST_LIMIT:-0}
      OPENAI_JARVIS_DAILY_REQUEST_LIMIT: ${OPENAI_JARVIS_DAILY_REQUEST_LIMIT:-0}
      OPENAI_SEMANTIC_SEARCH_DAILY_REQUEST_LIMIT: ${OPENAI_SEMANTIC_SEARCH_DAILY_REQUEST_LIMIT:-0}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:13000,http://${NAS_IP:-localhost}:${DASHBOARD_PORT:-13000}}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      APP_ENV: production
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:8000:8000"
    volumes:
      - ./config:/app/config:ro
    networks:
      - default
      - jarvis_ai_runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ── Collect worker ────────────────────────────────────────────────────────

  worker_collect:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: news_worker_collect
    restart: unless-stopped
    command: python -m app.workers.collect
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://news:${POSTGRES_PASSWORD}@postgres:5432/newsdb
      REDIS_URL: redis://redis:6379/0
      SOURCES_PATH: /app/config/sources.yaml
      COLLECT_ACTIVE_SLEEP_SECONDS: ${COLLECT_ACTIVE_SLEEP_SECONDS:-20}
      COLLECT_IDLE_SLEEP_SECONDS: ${COLLECT_IDLE_SLEEP_SECONDS:-45}
      COLLECT_MAX_DUE_SOURCES: ${COLLECT_MAX_DUE_SOURCES:-0}
      APP_ENV: production
    volumes:
      - ./config:/app/config:ro

  # ── Extract worker ────────────────────────────────────────────────────────

  worker_extract:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: news_worker_extract
    restart: unless-stopped
    command: python -m app.workers.extract
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      morss:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://news:${POSTGRES_PASSWORD}@postgres:5432/newsdb
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MORSS_URL: http://morss:8080
      EXTRACT_RETRY_BACKOFF_SECONDS: ${EXTRACT_RETRY_BACKOFF_SECONDS:-300}
      EXTRACT_RETRY_MAX_BACKOFF_SECONDS: ${EXTRACT_RETRY_MAX_BACKOFF_SECONDS:-3600}
      EXTRACT_RETRY_SCAN_LIMIT: ${EXTRACT_RETRY_SCAN_LIMIT:-25}
      AI_QUEUE_MAX_PENDING: ${AI_QUEUE_MAX_PENDING:-50}
      APP_ENV: production

  # ── AI worker ─────────────────────────────────────────────────────────────

  worker_ai:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: news_worker_ai
    restart: unless-stopped
    command: python -m app.workers.ai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://news:${POSTGRES_PASSWORD}@postgres:5432/newsdb
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama-central:11434}
      NEWS_SUMMARY_PROVIDER: ${NEWS_SUMMARY_PROVIDER:-local}
      BACKGROUND_AI_ENABLED: ${BACKGROUND_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      NEWS_SUMMARY_MODEL: ${NEWS_SUMMARY_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      ARTICLE_OUTPUT_TOKENS: ${ARTICLE_OUTPUT_TOKENS:-320}
      AI_BACKFILL_ENABLED: ${AI_BACKFILL_ENABLED:-false}
      AI_BACKFILL_REFRESH_EXISTING: ${AI_BACKFILL_REFRESH_EXISTING:-false}
      AI_BACKFILL_BATCH_SIZE: ${AI_BACKFILL_BATCH_SIZE:-20}
      AI_QUEUE_MAX_PENDING: ${AI_QUEUE_MAX_PENDING:-50}
      AI_PENDING_REFILL_BATCH_SIZE: ${AI_PENDING_REFILL_BATCH_SIZE:-10}
      AI_PENDING_REFILL_ENABLED: ${AI_PENDING_REFILL_ENABLED:-true}
      NEWS_SUMMARY_TIMEOUT_SECONDS: ${NEWS_SUMMARY_TIMEOUT_SECONDS:-30}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      SOURCES_PATH: /app/config/sources.yaml
      SCORING_PATH: /app/config/scoring_rules.yaml
      PROMPTS_PATH: /app/config/llm_prompts.yaml
      APP_ENV: production
    volumes:
      - ./config:/app/config:ro
    networks:
      - default
      - jarvis_ai_runtime

  # ── Cluster worker ────────────────────────────────────────────────────────

  worker_cluster:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: news_worker_cluster
    restart: unless-stopped
    command: python -m app.workers.cluster
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://news:${POSTGRES_PASSWORD}@postgres:5432/newsdb
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama-central:11434}
      NEWS_SUMMARY_PROVIDER: ${NEWS_SUMMARY_PROVIDER:-local}
      BACKGROUND_AI_ENABLED: ${BACKGROUND_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      NEWS_SUMMARY_MODEL: ${NEWS_SUMMARY_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      NEWS_SUMMARY_TIMEOUT_SECONDS: ${NEWS_SUMMARY_TIMEOUT_SECONDS:-30}
      CLUSTER_SIMILARITY_THRESHOLD: ${CLUSTER_SIMILARITY_THRESHOLD:-0.88}
      CLUSTER_WINDOW_HOURS: ${CLUSTER_WINDOW_HOURS:-72}
      APP_ENV: production
    volumes:
      - ./config:/app/config:ro
    networks:
      - default
      - jarvis_ai_runtime

  # ── Briefing worker ───────────────────────────────────────────────────────

  worker_briefing:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: news_worker_briefing
    restart: unless-stopped
    command: python -m app.workers.briefing
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://news:${POSTGRES_PASSWORD}@postgres:5432/newsdb
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama-central:11434}
      NEWS_SUMMARY_PROVIDER: ${NEWS_SUMMARY_PROVIDER:-local}
      BACKGROUND_AI_ENABLED: ${BACKGROUND_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      NEWS_SUMMARY_MODEL: ${NEWS_SUMMARY_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      NEWS_SUMMARY_TIMEOUT_SECONDS: ${NEWS_SUMMARY_TIMEOUT_SECONDS:-30}
      DAILY_BRIEFING_ENABLED: ${DAILY_BRIEFING_ENABLED:-true}
      DAILY_BRIEFING_TIMEZONE: ${DAILY_BRIEFING_TIMEZONE:-Europe/Paris}
      DAILY_BRIEFING_HOUR: ${DAILY_BRIEFING_HOUR:-7}
      DAILY_BRIEFING_MINUTE: ${DAILY_BRIEFING_MINUTE:-30}
      DAILY_BRIEFING_CATEGORY: ${DAILY_BRIEFING_CATEGORY:-all}
      BRIEFING_LANGUAGE: ${BRIEFING_LANGUAGE:-fr}
      BRIEFING_TICK_SECONDS: ${BRIEFING_TICK_SECONDS:-30}
      OBSIDIAN_EXPORT_ENABLED: ${OBSIDIAN_EXPORT_ENABLED:-false}
      OBSIDIAN_EXPORT_PATH: ${OBSIDIAN_EXPORT_PATH:-/app/exports/obsidian}
      APP_ENV: production
    volumes:
      - ./config:/app/config:ro
      - ./exports:/app/exports
    networks:
      - default
      - jarvis_ai_runtime

  # ── Cleanup/retention worker ──────────────────────────────────────────────

  worker_cleanup:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: news_worker_cleanup
    restart: unless-stopped
    command: python -m app.workers.cleanup
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://news:${POSTGRES_PASSWORD}@postgres:5432/newsdb
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-3600}
      PROCESSING_LOG_RETENTION_DAYS: ${PROCESSING_LOG_RETENTION_DAYS:-30}
      RAW_ITEM_RETENTION_DAYS: ${RAW_ITEM_RETENTION_DAYS:-14}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_RETENTION_ENABLED: ${MINIO_RETENTION_ENABLED:-true}
      RAW_HTML_RETENTION_DAYS: ${RAW_HTML_RETENTION_DAYS:-90}
      RAW_JSON_RETENTION_DAYS: ${RAW_JSON_RETENTION_DAYS:-365}
      ARTICLE_ARCHIVE_ENABLED: ${ARTICLE_ARCHIVE_ENABLED:-true}
      ARTICLE_ARCHIVE_DAYS: ${ARTICLE_ARCHIVE_DAYS:-30}
      APP_ENV: production
    volumes:
      # Cleanup applies the same admission policy as collect, extract, AI and
      # briefing. Without this mount it silently runs with policy_disabled.
      - ./config:/app/config:ro

  # ── Dashboard ─────────────────────────────────────────────────────────────

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${NAS_IP:-localhost}:8000
        NEXT_PUBLIC_MEILI_URL: http://${NAS_IP:-localhost}:7700
        NEXT_PUBLIC_MEILI_SEARCH_KEY: ${MEILI_SEARCH_KEY:-}
    container_name: news_dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DASHBOARD_BASIC_AUTH_ENABLED: ${DASHBOARD_BASIC_AUTH_ENABLED:-false}
      DASHBOARD_BASIC_AUTH_USER: ${DASHBOARD_BASIC_AUTH_USER:-}
      DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_BASIC_AUTH_PASSWORD:-}
    ports:
      - "${DASHBOARD_PORT:-13000}:3000"

  # ── Monitoring ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: news_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-19090}:9090"
    depends_on:
      api:
        condition: service_started

volumes:
  prometheus_data:

networks:
  # Created by the Jarvis stack; Helix only joins it.
  jarvis_ai_runtime:
    external: true
    name: jarvis_ai_runtime
